      THESIS: Kairo is the right moment for each piece of work. One quiet ink workspace where a single saffron dot marks "now", instead of the indigo SaaS dashboard look.

      STORY: A visitor sees the spreadsheet rebuilt as a calm workspace, flips between two scopes, believes it is safe to share, and opens the live demo.
      FIRST VIEWPORT: Ink stage. Kairo lockup and nav. Display headline, one subline, saffron "Try the live demo" with a ghost secondary. Underneath, full width, the real light workspace with the "Viewing as" switch.
      FORM: user-pinned direction "Calm premium" (Linear / Things register); no concept roll.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
